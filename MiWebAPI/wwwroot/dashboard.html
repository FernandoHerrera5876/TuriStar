<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Panel de Administrador | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Librería para hacer las gráficas -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <div class="mb-4">
            <h1 class="h3 fw-bold text-dark"><i class="bi bi-bar-chart-fill text-success"></i> Estadísticas TuriStar</h1>
            <p class="text-muted">Vista exclusiva de administrador.</p>
        </div>

        <div class="row g-4">
            <!-- Gráfica 1: Visitas/Interacciones -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 h-100 p-3">
                    <h5 class="fw-bold mb-3 text-center">Lugares Más Visitados</h5>
                    <canvas id="graficoVisitas"></canvas>
                </div>
            </div>

            <!-- Gráfica 2: Puntuaciones -->
            <div class="col-lg-6">
                <div class="card border-0 shadow-sm rounded-4 h-100 p-3">
                    <h5 class="fw-bold mb-3 text-center">Mejores Puntuaciones</h5>
                    <canvas id="graficoPuntuaciones"></canvas>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
