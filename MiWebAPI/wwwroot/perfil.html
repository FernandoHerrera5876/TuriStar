<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <h1 class="fw-bold h2 mb-4">Mi Perfil</h1>

        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta de Usuario -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 text-center p-4 sticky-lg-top" style="top: 100px;">
                    <div class="bg-turistar-green text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 120px; height: 120px; font-size: 3rem; overflow: hidden;">
                        <span id="perfilInicial">U</span>
                    </div>
                    <h2 class="h4 fw-bold mb-1" id="perfilNombre">Cargando...</h2>

                    <!-- Aquí aparecerá tu correo real -->
                    <p class="text-muted small mb-4" id="perfilCorreo">cargando@correo.com</p>

                    <div class="d-grid gap-2">
                        <!-- Botón 1: Enlace directo (<a>) para Editar Perfil -->
                        <a href="editar_perfil.html" id="btnEditarPerfil" class="btn btn-outline-success rounded-pill fw-medium py-2 mb-2 text-center text-decoration-none">
                            <i class="bi bi-pencil-square"></i> Editar Perfil
                        </a>

                        <!-- Botón 2 y 3: Uso de eventos onclick directamente en HTML -->
                        <button id="btnCerrarSesion" class="btn btn-outline-secondary rounded-pill fw-medium py-2 mb-2" onclick="cerrarSesionPerfil()">
                            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                        </button>

                        <button id="btnBorrarCuenta" class="btn btn-outline-danger rounded-pill fw-medium py-2" onclick="borrarCuentaPerfil(this)">
                            <i class="bi bi-person-x-fill"></i> Eliminar mi cuenta
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Actividad Reciente -->
            <div class="col-lg-8">
                <!-- Pestañas de navegación interna -->
                <ul class="nav nav-tabs mb-4 border-0">
                    <li class="nav-item">
                        <a id="tabResenas" class="nav-link active fw-bold text-turistar-green border-0 border-bottom border-2 border-success bg-transparent" href="#" style="cursor:pointer;">Mis Reseñas</a>
                    </li>
                    <li class="nav-item">
                        <a id="tabGuardados" class="nav-link text-muted border-0 bg-transparent" href="#" style="cursor:pointer;">Guardados</a>
                    </li>
                </ul>

                <!-- Contenedor dinámico de Reseñas -->
                <div id="contenedorResenas">
                    <div class="text-center my-4"><div class="spinner-border text-success"></div></div>
                </div>

                <!-- Contenedor dinámico de Guardados (Oculto por defecto) -->
                <div id="contenedorGuardados" class="d-none row row-cols-1 row-cols-md-2 g-4">
                    <!-- Las tarjetas se inyectan aquí -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/perfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Modal para Editar Reseñas -->
    <div class="modal fade" id="modalEditarResena" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-dark" id="modalEditarLabel"><i class="bi bi-pencil-square text-warning"></i> Editar Reseña</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarResena">
                        <input type="hidden" id="editIdResena">
                        <div class="mb-3">
                            <label class="form-label fw-medium small">Calificación</label>
                            <select class="form-select" id="editCalificacion" required>
                                <option value="5">5 Estrellas - Excelente</option>
                                <option value="4">4 Estrellas - Muy Bueno</option>
                                <option value="3">3 Estrellas - Regular</option>
                                <option value="2">2 Estrellas - Malo</option>
                                <option value="1">1 Estrella - Pésimo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium small">Comentario</label>
                            <textarea class="form-control" id="editComentario" rows="3" required></textarea>
                        </div>
                        <div id="alertaEditarResena" class="alert d-none small py-2 text-center"></div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-warning rounded-pill px-4 fw-medium" id="btnGuardarEdicionResena">Actualizar Reseña</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
