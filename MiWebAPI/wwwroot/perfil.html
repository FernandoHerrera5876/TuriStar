<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <h1 class="fw-bold h2 mb-4">Mi Perfil</h1>

        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta de Usuario -->
            <div class="col-lg-4">
                <div class="card shadow-sm border-0 rounded-4 text-center p-4 sticky-lg-top" style="top: 100px;">
                    <div class="bg-turistar-green text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3" style="width: 120px; height: 120px; font-size: 3rem; overflow: hidden;">
                        <span id="perfilInicial">U</span>
                    </div>
                    <h2 class="h4 fw-bold mb-1" id="perfilNombre">Cargando...</h2>

                    <!-- Aquí aparecerá tu correo real -->
                    <p class="text-muted small mb-4" id="perfilCorreo">cargando@correo.com</p>

                    <a href="editar_perfil.html" class="btn btn-outline-success rounded-pill w-100 fw-medium mb-2" style="color: #528233; border-color: #528233;">
                        <i class="bi bi-pencil-square"></i> Editar Perfil
                    </a>
                    <button class="btn btn-light rounded-pill w-100 fw-medium text-danger" onclick="cerrarSesion()">
                        <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                    </button>
                </div>
            </div>

            <!-- Columna Derecha: Actividad Reciente -->
            <div class="col-lg-8">
                <!-- Pestañas de navegación interna -->
                <ul class="nav nav-tabs mb-4 border-0">
                    <li class="nav-item">
                        <a id="tabResenas" class="nav-link active fw-bold text-turistar-green border-0 border-bottom border-2 border-success bg-transparent" href="#" style="cursor:pointer;">Mis Reseñas</a>
                    </li>
                    <li class="nav-item">
                        <a id="tabGuardados" class="nav-link text-muted border-0 bg-transparent" href="#" style="cursor:pointer;">Guardados</a>
                    </li>
                </ul>

                <!-- Contenedor dinámico de Reseñas -->
                <div id="contenedorResenas">
                    <div class="text-center my-4"><div class="spinner-border text-success"></div></div>
                </div>

                <!-- Contenedor dinámico de Guardados (Oculto por defecto) -->
                <div id="contenedorGuardados" class="d-none row row-cols-1 row-cols-md-2 g-4">
                    <!-- Las tarjetas se inyectan aquí -->
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <!-- Agregamos el nuevo script de perfil -->
    <script src="js/perfil.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
