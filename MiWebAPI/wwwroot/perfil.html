<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mi Perfil | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .profile-card,
        .profile-panel-card,
        #contenedorResenas .card,
        #contenedorGuardados .card {
            background: linear-gradient(155deg, rgba(22, 35, 58, 0.96) 0%, rgba(12, 20, 34, 0.98) 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.35) !important;
            border-radius: 22px !important;
            color: #e2e8f0 !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease !important;
        }

            .profile-card:hover,
            .profile-panel-card:hover,
            #contenedorResenas .card:hover,
            #contenedorGuardados .card:hover {
                border-color: rgba(74, 222, 128, 0.75) !important;
                box-shadow: 0 0 32px rgba(74, 222, 128, 0.25), 0 16px 38px rgba(0, 0, 0, 0.65) !important;
            }

        .profile-avatar-box {
            width: 120px;
            height: 120px;
            font-size: 3rem;
            overflow: hidden;
            border: 2.5px solid #4ade80 !important;
            box-shadow: 0 0 24px rgba(74, 222, 128, 0.42);
        }

        .empty-state-icon-ring {
            width: 88px;
            height: 88px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.2) 0%, rgba(74, 222, 128, 0.03) 72%);
            border: 1px solid rgba(74, 222, 128, 0.35);
            box-shadow: 0 0 24px rgba(74, 222, 128, 0.18);
        }

        .profile-tabs .nav-link {
            color: #94a3b8 !important;
            font-weight: 600;
            padding: 0.55rem 1.15rem;
            border-bottom: 2px solid transparent !important;
            transition: all 0.25s ease;
        }

            .profile-tabs .nav-link:hover {
                color: #ffffff !important;
            }

            .profile-tabs .nav-link.active {
                color: #4ade80 !important;
                font-weight: 700 !important;
                border-bottom: 2px solid #4ade80 !important;
                text-shadow: 0 0 12px rgba(74, 222, 128, 0.35);
            }

        .btn-glass-ios-neutral {
            position: relative;
            overflow: hidden;
            background: rgba(148, 163, 184, 0.16);
            backdrop-filter: blur(14px) saturate(170%);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            border-top: 1px solid rgba(255, 255, 255, 0.32);
            border-left: 1px solid rgba(255, 255, 255, 0.16);
            border-right: 1px solid rgba(255, 255, 255, 0.16);
            border-bottom: 1px solid rgba(148, 163, 184, 0.35);
            color: #f8fafc !important;
            font-weight: 600;
            border-radius: 50rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3), inset 0 1px 1px rgba(255, 255, 255, 0.25);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

            .btn-glass-ios-neutral:hover {
                background: rgba(148, 163, 184, 0.28);
                border-color: rgba(255, 255, 255, 0.65);
                transform: translateY(-2px);
                color: #ffffff !important;
            }

        .btn-glass-ios-amber {
            position: relative;
            overflow: hidden;
            background: rgba(245, 158, 11, 0.22);
            backdrop-filter: blur(14px) saturate(170%);
            -webkit-backdrop-filter: blur(14px) saturate(170%);
            border-top: 1px solid rgba(255, 255, 255, 0.42);
            border-left: 1px solid rgba(253, 224, 71, 0.25);
            border-right: 1px solid rgba(253, 224, 71, 0.25);
            border-bottom: 1px solid rgba(251, 191, 36, 0.55);
            color: #fef08a !important;
            font-weight: 600;
            border-radius: 50rem;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.32), inset 0 1px 1px rgba(255, 255, 255, 0.3);
            transition: all 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

            .btn-glass-ios-amber:hover {
                background: rgba(245, 158, 11, 0.36);
                border-color: #fbbf24;
                color: #ffffff !important;
                transform: translateY(-2px);
                box-shadow: 0 0 20px rgba(251, 191, 36, 0.35);
            }

        .profile-modal .modal-content {
            background: linear-gradient(160deg, #162238 0%, #0f1828 100%);
            border: 1.5px solid rgba(74, 222, 128, 0.45);
            color: #e2e8f0;
            box-shadow: 0 0 36px rgba(74, 222, 128, 0.2), 0 20px 50px rgba(0, 0, 0, 0.75);
        }

        .profile-modal .form-control,
        .profile-modal .form-select {
            background-color: #162235 !important;
            border: 1px solid #2b3f5e !important;
            color: #ffffff !important;
        }

            .profile-modal .form-control:focus,
            .profile-modal .form-select:focus {
                border-color: #4ade80 !important;
                box-shadow: 0 0 0 0.25rem rgba(74, 222, 128, 0.24) !important;
            }
            .profile-modal .form-control[type="file"]::file-selector-button {
                background: rgba(74, 222, 128, 0.16);
                color: #4ade80;
                border: 1px solid rgba(74, 222, 128, 0.45);
                border-radius: 10px;
                padding: 0.35rem 0.75rem;
                margin-right: 0.75rem;
                font-weight: 600;
                font-size: 0.82rem;
                cursor: pointer;
                transition: all 0.22s ease;
            }

            .profile-modal .form-control[type="file"]:hover::file-selector-button {
                background: rgba(74, 222, 128, 0.3);
                color: #ffffff;
            }

        .edit-photo-item {
            position: relative;
            width: 86px;
            height: 86px;
            border-radius: 12px;
            overflow: hidden;
            border: 1.5px solid rgba(74, 222, 128, 0.45);
            background: #0b1320;
            transition: all 0.22s ease;
        }

            .edit-photo-item img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: opacity 0.2s ease, filter 0.2s ease;
            }

            .edit-photo-item.marked-delete {
                border-color: #ef4444;
                box-shadow: 0 0 14px rgba(239, 68, 68, 0.35);
            }

                .edit-photo-item.marked-delete img {
                    opacity: 0.3;
                    filter: grayscale(100%);
                }

        .edit-photo-badge-del {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.68rem;
            font-weight: 700;
            color: #fecaca;
            text-transform: uppercase;
            pointer-events: none;
            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
        }

        .edit-photo-action {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.35);
            background: rgba(220, 38, 38, 0.88);
            color: #ffffff;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.72rem;
            padding: 0;
            cursor: pointer;
            z-index: 2;
        }

        .edit-photo-item.marked-delete .edit-photo-action {
            background: rgba(34, 197, 94, 0.9);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <div class="mb-4">
            <span id="perfilTipoCuenta" class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 2px; font-size: 0.78rem;">Cuenta de Viajero</span>
            <h1 class="fw-bold h2 mb-0">Mi Perfil</h1>
        </div>

        <div class="row g-4">
            <!-- Columna Izquierda: Tarjeta de Usuario -->
            <div class="col-lg-4">
                <div class="card profile-card border-0 rounded-4 text-center p-4 sticky-lg-top" style="top: 100px;">
                    <div class="bg-turistar-green text-white rounded-circle d-flex align-items-center justify-content-center mx-auto mb-3 profile-avatar-box">
                        <span id="perfilInicial">U</span>
                    </div>
                    <h2 class="h4 fw-bold mb-1 text-white" id="perfilNombre">Cargando...</h2>

                    <!-- Aquí aparecerá tu correo real -->
                    <p class="text-muted small mb-4" id="perfilCorreo">cargando@correo.com</p>

                    <div class="d-grid gap-2">
                        <a href="dashboard.html" id="btnPerfilGraficas" class="btn btn-glass-ios-amber fw-medium py-2 text-center text-decoration-none d-none">
                            <i class="bi bi-bar-chart-fill me-1"></i> Ver Gráficas y Estadísticas
                        </a>
                        <!-- Botón 1: Enlace directo (<a>) para Editar Perfil -->
                        <a href="editar_perfil.html" id="btnEditarPerfil" class="btn btn-glass-ios fw-medium py-2 text-center text-decoration-none">
                            <i class="bi bi-pencil-square me-1"></i> Editar Perfil
                        </a>

                        <!-- Botón 2 y 3: Uso de eventos onclick directamente en HTML -->
                        <button id="btnCerrarSesionPerfil" class="btn btn-glass-ios-neutral fw-medium py-2" onclick="cerrarSesionPerfil()">
                            <i class="bi bi-box-arrow-right me-1"></i> Cerrar Sesión
                        </button>

                        <button id="btnBorrarCuenta" class="btn btn-glass-ios-red fw-medium py-2 justify-content-center" onclick="borrarCuentaPerfil(this)">
                            <i class="bi bi-person-x-fill me-1"></i> Eliminar mi cuenta
                        </button>
                    </div>
                </div>
            </div>

            <!-- Columna Derecha: Actividad Reciente -->
            <div class="col-lg-8">
                <!-- Pestañas de navegación interna -->
                <ul class="nav nav-tabs profile-tabs mb-4 border-0 gap-2">
                    <li class="nav-item">
                        <a id="tabResenas" class="nav-link active bg-transparent" href="#" style="cursor:pointer;">Mis Reseñas</a>
                    </li>
                    <li class="nav-item">
                        <a id="tabGuardados" class="nav-link bg-transparent" href="#" style="cursor:pointer;">Guardados</a>
                    </li>
                </ul>

                <!-- Contenedor dinámico de Reseñas -->
                <div id="contenedorResenas">
                    <div class="text-center my-4"><div class="spinner-border text-success"></div></div>
                </div>

                <!-- Contenedor dinámico de Guardados (Oculto por defecto) -->
                <div id="contenedorGuardados" class="d-none row row-cols-1 row-cols-md-2 g-4">
                    <!-- Las tarjetas se inyectan aquí -->
                </div>
            </div>
        </div>
    </main>

    <!-- Modal para Editar Reseñas -->
    <div class="modal fade profile-modal" id="modalEditarResena" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content border-0 rounded-4 shadow">
                <div class="modal-header border-0 pb-0">
                    <h5 class="modal-title fw-bold text-white" id="modalEditarLabel">
                        <i class="bi bi-pencil-square text-warning me-1"></i> Editar Reseña
                    </h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <form id="formEditarResena">
                        <input type="hidden" id="editIdResena">

                        <div class="mb-3">
                            <label class="form-label fw-medium small text-light">Calificación</label>
                            <select class="form-select" id="editCalificacion" required>
                                <option value="5">5 Estrellas - Excelente</option>
                                <option value="4">4 Estrellas - Muy Bueno</option>
                                <option value="3">3 Estrellas - Regular</option>
                                <option value="2">2 Estrellas - Malo</option>
                                <option value="1">1 Estrella - Pésimo</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-medium small text-light">Comentario</label>
                            <textarea class="form-control" id="editComentario" rows="3" required></textarea>
                        </div>

                        <!-- Fotos actuales de la reseña -->
                        <div class="mb-3">
                            <label class="form-label fw-medium small text-light d-block">
                                <i class="bi bi-images text-turistar-green me-1"></i> Fotos actuales
                            </label>
                            <div id="editFotosActuales" class="d-flex flex-wrap gap-2"></div>
                        </div>

                        <!-- Agregar nuevas fotos -->
                        <div class="mb-3">
                            <label for="editFotosNuevas" class="form-label fw-medium small text-light">
                                <i class="bi bi-plus-circle text-turistar-green me-1"></i> Agregar nuevas fotos (opcional)
                            </label>
                            <input type="file" class="form-control" id="editFotosNuevas" accept="image/*" multiple>
                            <div id="editPreviewNuevas" class="d-flex flex-wrap gap-2 mt-2"></div>
                        </div>

                        <div id="alertaEditarResena" class="alert d-none small py-2 text-center"></div>
                    </form>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-glass-ios-neutral btn-sm px-3" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-glass-ios px-4 fw-medium" id="btnGuardarEdicionResena">Actualizar Reseña</button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js?v=1.0"></script>
    <script src="js/components.js?v=5.0"></script>
    <script src="js/perfil.js?v=5.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
