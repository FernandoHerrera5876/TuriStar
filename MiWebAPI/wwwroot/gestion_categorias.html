<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <title>Gestión Categorías</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container bg-white p-4 rounded-4 shadow-sm">
        <h3 class="fw-bold mb-4">Gestión de Categorías</h3>

        <div class="row">
            <!-- Formulario de registro -->
            <div class="col-md-4">
                <form id="formCategoria">
                    <div class="mb-3">
                        <label>Nombre de Categoría *</label>
                        <!-- Validación de campos obligatorios (Punto de rúbrica) -->
                        <input type="text" id="catNombre" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label>Descripción</label>
                        <input type="text" id="catDescripcion" class="form-control">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Guardar Categoría</button>
                </form>

                <!-- Contenedor para mostrar numeroError y respuesta -->
                <div id="alertaCategoria" class="alert mt-3 d-none small"></div>
            </div>

            <!-- Tabla donde aparecerá el registro -->
            <div class="col-md-8">
                <table class="table table-bordered table-striped">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Descripción</th>
                        </tr>
                    </thead>
                    <tbody id="bodyCategorias">
                        <!-- Los datos se inyectarán aquí -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="js/config.js"></script>
    <script src="js/gestion_categorias.js"></script>
</body>
</html>
