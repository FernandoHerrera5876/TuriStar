<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gestión de Categorías | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .glass-surface {
            background: linear-gradient(155deg, rgba(22, 35, 58, 0.96) 0%, rgba(12, 20, 34, 0.98) 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.35) !important;
            border-radius: 22px !important;
            color: #e2e8f0 !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
        }

        .table-glass {
            --bs-table-bg: transparent;
            --bs-table-color: #e2e8f0;
            --bs-table-border-color: rgba(148, 163, 184, 0.16);
            --bs-table-striped-bg: rgba(255, 255, 255, 0.03);
            --bs-table-striped-color: #f8fafc;
            --bs-table-hover-bg: rgba(74, 222, 128, 0.1);
            --bs-table-hover-color: #ffffff;
            margin-bottom: 0;
        }

            .table-glass thead th {
                background: rgba(11, 19, 32, 0.85);
                color: #4ade80;
                font-weight: 700;
                font-size: 0.82rem;
                text-transform: uppercase;
                letter-spacing: 0.8px;
                border-bottom: 1px solid rgba(74, 222, 128, 0.35);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <div class="mb-4">
            <span class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 2px; font-size: 0.78rem;">Administración</span>
            <h1 class="h2 fw-bold text-white mb-0">Gestión de Categorías</h1>
        </div>

        <div class="row g-4">
            <!-- Formulario de registro -->
            <div class="col-md-4">
                <div class="card glass-surface border-0 p-4 h-100">
                    <h2 class="h5 fw-bold text-white mb-3">
                        <i class="bi bi-tags-fill text-turistar-green me-2"></i>Nueva Categoría
                    </h2>
                    <form id="formCategoria">
                        <div class="mb-3">
                            <label for="catNombre" class="form-label small fw-semibold text-light">Nombre de Categoría *</label>
                            <input type="text" id="catNombre" class="form-control input-yellow rounded-3 p-2" placeholder="Ej. Pueblos Mágicos" required>
                        </div>
                        <div class="mb-4">
                            <label for="catDescripcion" class="form-label small fw-semibold text-light">Descripción</label>
                            <input type="text" id="catDescripcion" class="form-control input-yellow rounded-3 p-2" placeholder="Breve descripción...">
                        </div>
                        <button type="submit" class="btn btn-glass-ios w-100">
                            <i class="bi bi-plus-circle me-1"></i> Guardar Categoría
                        </button>
                    </form>

                    <!-- Contenedor para mostrar numeroError y respuesta -->
                    <div id="alertaCategoria" class="alert mt-3 d-none small rounded-3"></div>
                </div>
            </div>

            <!-- Tabla donde aparecerá el registro -->
            <div class="col-md-8">
                <div class="card glass-surface border-0 p-4 h-100">
                    <h2 class="h5 fw-bold text-white mb-3">Categorías Registradas</h2>
                    <div class="table-responsive rounded-3 overflow-hidden border border-secondary border-opacity-25">
                        <table class="table table-glass table-striped table-hover align-middle">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nombre</th>
                                    <th>Descripción</th>
                                </tr>
                            </thead>
                            <tbody id="bodyCategorias">
                                <!-- Los datos se inyectarán aquí -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/gestion_categorias.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
