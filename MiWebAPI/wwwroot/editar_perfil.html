<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Editar Perfil | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1 d-flex justify-content-center align-items-start">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5" style="max-width: 600px; width: 100%;">
            <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-4">
                <h1 class="h3 fw-bold mb-0">Editar Perfil</h1>
                <a href="perfil.html" class="btn btn-sm btn-outline-secondary rounded-pill px-3">Cancelar</a>
            </div>

            <!-- Contenedor de Alertas -->
            <div id="mensajeAlerta" class="alert d-none py-2 px-3 small text-center" role="alert"></div>

            <form id="formEditarPerfil">
                <!-- Foto de Perfil -->
                <div class="text-center mb-4">
                    <img id="previewFoto" src="https://via.placeholder.com/120?text=Foto" class="rounded-circle mb-3 object-fit-cover shadow-sm" style="width: 120px; height: 120px;">
                    <div>
                        <label for="inputFoto" class="btn btn-sm btn-outline-success rounded-pill px-3">
                            <i class="bi bi-camera"></i> Cambiar Foto
                        </label>
                        <input type="file" id="inputFoto" class="d-none" accept="image/png, image/jpeg">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-medium small mb-1">Nombre(s)</label>
                        <input id="editNombres" type="text" class="form-control input-yellow p-2" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-medium small mb-1">Apellidos</label>
                        <input id="editApellidos" type="text" class="form-control input-yellow p-2" required>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-medium small mb-1">Fecha de nacimiento</label>
                    <input id="editFechaNac" type="date" class="form-control input-yellow p-2" required>
                </div>

                <button id="btnGuardar" type="submit" class="btn bg-turistar-green text-white w-100 py-2 fw-medium rounded-3">Guardar Cambios</button>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/editar_perfil.js"></script>
</body>
</html>
