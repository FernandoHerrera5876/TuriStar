<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escribe tu Reseña | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .resena-glass-card {
            background: linear-gradient(155deg, rgba(22, 35, 58, 0.96) 0%, rgba(12, 20, 34, 0.98) 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.38) !important;
            border-radius: 24px !important;
            color: #e2e8f0 !important;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
        }

        .upload-glass-zone {
            border: 1.5px dashed rgba(74, 222, 128, 0.45);
            background: rgba(11, 19, 32, 0.65);
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.25s ease;
        }

            .upload-glass-zone:hover {
                border-color: #4ade80;
                background: rgba(74, 222, 128, 0.08);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 d-flex justify-content-center align-items-center flex-grow-1">
        <div class="card resena-glass-card border-0 p-4 p-md-5" style="max-width: 620px; width: 100%;">
            <span class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 2px; font-size: 0.74rem;">Comunidad</span>
            <h1 class="h3 fw-bold mb-1 text-white">Escribe tu Reseña</h1>
            <p class="text-muted small pb-3 mb-4" style="border-bottom: 1px solid rgba(148, 163, 184, 0.16);">
                Para: <span class="text-light fw-semibold">Grutas de Tolantongo</span>
            </p>

            <form action="exito_resena.html">
                <div class="mb-4">
                    <label class="fw-semibold small mb-2 text-light d-block">Tu valoración general</label>
                    <div class="text-warning fs-4">
                        <i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star text-muted"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="fw-semibold small mb-2 text-light d-block">Escribe tu opinión</label>
                    <textarea class="form-control input-yellow rounded-3 p-3" rows="5" placeholder="Escribe tu opinión aquí..." required></textarea>
                </div>

                <div class="mb-4 p-4 upload-glass-zone text-center">
                    <i class="bi bi-camera fs-3 text-turistar-green"></i>
                    <p class="mb-0 fw-semibold small text-white mt-1">Subir Fotos</p>
                    <small class="text-muted" style="font-size: 0.75rem;">Formatos aceptados: JPG, PNG (Max 5MB)</small>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <button type="button" class="btn btn-crystal-ios-neutral rounded-pill px-4" onclick="history.back()">Cancelar</button>
                    <button type="submit" class="btn btn-glass-ios px-4">Publicar Reseña</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
