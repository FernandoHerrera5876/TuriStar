<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Escribe tu Reseña | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body style="background-color: #fcf8ee;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 d-flex justify-content-center">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5" style="max-width: 600px; width: 100%;">
            <h1 class="h3 fw-bold mb-1">Escribe tu Reseña</h1>
            <p class="text-muted small border-bottom pb-3 mb-4">Para: Grutas de Tolantongo</p>

            <form action="exito_resena.html">
                <div class="mb-4">
                    <label class="fw-bold small mb-2">Tu valoración general</label>
                    <div class="text-warning fs-4">
                        <i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star"></i><i class="bi bi-star text-muted"></i>
                    </div>
                </div>

                <div class="mb-4">
                    <label class="fw-bold small mb-2">Escribe tu opinión</label>
                    <textarea class="form-control input-yellow" rows="5" placeholder="Escribe tu opinión aquí..." required></textarea>
                </div>

                <div class="mb-4 p-4 border border-dashed rounded text-center text-success bg-light" style="border-color: #528233 !important; border-style: dashed !important; cursor: pointer;">
                    <i class="bi bi-camera fs-4"></i>
                    <p class="mb-0 fw-medium small">Subir Fotos</p>
                    <small class="text-muted" style="font-size: 0.7rem;">Formatos aceptados: JPG, PNG (Max 5MB)</small>
                </div>

                <div class="d-flex justify-content-end gap-3">
                    <button type="button" class="btn btn-outline-secondary px-4 fw-medium" onclick="history.back()">Cancelar</button>
                    <button type="submit" class="btn bg-turistar-green text-white px-4 fw-medium">Publicar Reseña</button>
                </div>
            </form>
        </div>
    </main>

    <script src="js/components.js"></script>
</body>
</html>
