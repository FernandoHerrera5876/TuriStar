<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comunidad y Reseñas | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .review-card {
            background: linear-gradient(160deg, #152238 0%, #101929 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.4) !important;
            border-radius: 20px !important;
            color: #e2e8f0 !important;
            box-shadow: 0 8px 26px rgba(0, 0, 0, 0.45);
            animation: borderRotate 4s ease-in-out infinite;
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.35s ease !important;
            transform: translateZ(0);
        }

            .review-card:hover {
                transform: translateY(-4px) scale(1.01) translateZ(0);
                border-color: #4ade80 !important;
                box-shadow: 0 0 36px rgba(74, 222, 128, 0.45), inset 0 0 14px rgba(74, 222, 128, 0.1), 0 14px 34px rgba(0, 0, 0, 0.6) !important;
                animation: none;
            }

        .review-avatar-ring {
            width: 58px;
            height: 58px;
            border: 2px solid #4ade80 !important;
            box-shadow: 0 0 16px rgba(74, 222, 128, 0.35);
        }

        .review-destination-badge {
            background: rgba(74, 222, 128, 0.14);
            border: 1px solid rgba(74, 222, 128, 0.5);
            color: #ffffff;
            border-radius: 999px;
            padding: 0.42rem 0.9rem;
            font-size: 0.82rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 0 14px rgba(74, 222, 128, 0.18);
        }

        .review-quote {
            color: #cbd5e1;
            line-height: 1.65;
        }

        .btn-review-glass {
            background: rgba(74, 222, 128, 0.16);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(74, 222, 128, 0.6);
            color: #ffffff !important;
            border-radius: 999px;
            padding: 0.45rem 1.2rem;
            font-size: 0.85rem;
            font-weight: 600;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.25), 0 0 16px rgba(74, 222, 128, 0.22);
            transition: all 0.25s ease;
        }

            .btn-review-glass:hover {
                background: rgba(74, 222, 128, 0.34);
                border-color: #4ade80;
                transform: translateY(-2px);
                box-shadow: 0 0 24px rgba(74, 222, 128, 0.48), inset 0 1px 1px rgba(255, 255, 255, 0.45);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <div class="text-center mb-5">
            <span class="text-turistar-green fw-bold text-uppercase d-block mb-2" style="letter-spacing: 2.2px; font-size: 0.78rem;">Comunidad</span>
            <h1 class="fw-bold h2 mb-2">Lo que dicen nuestros viajeros</h1>
            <p class="text-muted mb-0">Descubre las experiencias más recientes de la comunidad TuriStar en Hidalgo.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Contenedor del muro de reseñas -->
                <div id="muroResenas">
                    <div class="text-center my-5" id="spinnerMuro">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="text-muted mt-2 small">Cargando experiencias...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=1.0"></script>
    <script src="js/components.js?v=1.0"></script>
    <script src="js/resenas.js?v=3.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
