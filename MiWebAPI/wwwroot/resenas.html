<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Comunidad y Reseñas | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1">
        <div class="text-center mb-5">
            <h1 class="fw-bold h2">Lo que dicen nuestros viajeros</h1>
            <p class="text-muted">Descubre las experiencias más recientes de la comunidad TuriStar en Hidalgo.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <!-- Contenedor del muro de reseñas -->
                <div id="muroResenas">
                    <div class="text-center my-5" id="spinnerMuro">
                        <div class="spinner-border text-success" role="status"></div>
                        <p class="text-muted mt-2 small">Cargando experiencias...</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/resenas.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
