<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TuriStar | Explorar Hidalgo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .search-hero {
            background-color: #3b5998;
            border-radius: 16px;
            padding: 3rem 2rem;
            color: white;
            text-align: center;
        }

        .section-title {
            color: #111D33;
            font-weight: bold;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-4 flex-grow-1">
        <section class="search-hero mb-5 shadow-sm">
            <h1 class="fw-bold h2 mb-4">¿Cuál será tu próxima aventura en Hidalgo?</h1>
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="input-group input-group-lg">
                        <span class="input-group-text bg-white border-0 ps-4 rounded-start-pill">
                            <i class="bi bi-search text-muted"></i>
                        </span>
                        <input type="text" id="inputBuscarDestino" class="form-control border-0 py-3 rounded-end-pill" placeholder="Buscar tu próximo destino en Hidalgo...">
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 gap-3">
            <h2 class="h4 section-title mb-0">Lugares Tendencia</h2>

            <a href="nuevo_destino.html" class="btn text-white rounded-pill fw-bold px-4 py-2 shadow-sm text-nowrap" style="background-color: #528233;">
                <i class="bi bi-geo-alt-fill me-2"></i>¿Falta un lugar? ¡Agrégalo!
            </a>
        </div>

        <!-- Alertas y Spinner -->
        <div id="mensajeEstado" class="alert d-none text-center" role="alert"></div>
        <div id="spinnerCarga" class="text-center my-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando destinos desde la base de datos...</p>
        </div>

        <!-- AQUÍ SE INYECTARÁN LAS TARJETAS DESDE JS -->
        <div id="contenedorDestinos" class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <!-- El contenido dinámico aparecerá aquí -->
        </div>

    </main>

    <script src="js/config.js?v=1.0"></script>
    <script src="js/components.js?v=1.0"></script>
    <script src="js/explorar.js?v=1.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
