<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TuriStar | Explorar Hidalgo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .search-hero {
            position: relative;
            overflow: hidden;
            background: #131d2e;
            border: 1px solid rgba(74, 222, 128, 0.35);
            border-radius: 22px;
            padding: 4.2rem 2rem;
            color: #ffffff;
            text-align: center;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
            transform: translateZ(0);
        }

        .hero-carousel-bg {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

            .hero-carousel-bg,
            .hero-carousel-bg .carousel-inner,
            .hero-carousel-bg .carousel-item {
                height: 100%;
            }

                /* Transición suave estilo Apple / moderna */
                .hero-carousel-bg .carousel-item {
                    transition: opacity 1.35s cubic-bezier(0.22, 1, 0.36, 1);
                }

                    .hero-carousel-bg .carousel-item img {
                        width: 100%;
                        height: 100%;
                        object-fit: cover;
                        /* Mucho más luminosa y vibrante */
                        filter: brightness(0.78) contrast(1.06) saturate(1.22);
                        transform: scale(1) translateZ(0);
                        will-change: transform;
                    }

                    /* Efecto Ken Burns: zoom lento y envolvente mientras la imagen está activa */
                    .hero-carousel-bg .carousel-item.active img,
                    .hero-carousel-bg .carousel-item-next.carousel-item-start img,
                    .hero-carousel-bg .carousel-item-prev.carousel-item-end img {
                        animation: kenBurnsZoom 6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
                    }

        @keyframes kenBurnsZoom {
            0% {
                transform: scale(1) translate3d(0, 0, 0);
            }

            100% {
                transform: scale(1.11) translate3d(-1%, -1%, 0);
            }
        }

        /* Viñeta sutil para que el texto sea 100% legible sin opacar la foto */
        .hero-overlay {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: linear-gradient( 180deg, rgba(11, 19, 32, 0.35) 0%, rgba(11, 19, 32, 0.58) 50%, rgba(11, 19, 32, 0.72) 100% );
            pointer-events: none;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero-title-shadow {
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.65);
        }

        /* Indicadores modernos tipo píldora abajo */
        .hero-indicators {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 8px;
            margin: 0;
            padding: 0;
            list-style: none;
        }

            .hero-indicators button {
                width: 24px;
                height: 4px;
                border-radius: 999px;
                border: none;
                background-color: rgba(255, 255, 255, 0.35);
                transition: all 0.4s ease;
                padding: 0;
            }

                .hero-indicators button.active {
                    width: 38px;
                    background-color: #4ade80;
                    box-shadow: 0 0 10px rgba(74, 222, 128, 0.7);
                }

        .search-input-dark {
            background-color: rgba(19, 29, 46, 0.78) !important;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.22) !important;
            color: #ffffff !important;
        }

            .search-input-dark::placeholder {
                color: #e2e8f0 !important;
            }

            .search-input-dark:focus {
                background-color: rgba(22, 34, 53, 0.92) !important;
                color: #ffffff !important;
                border-color: #4ade80 !important;
                box-shadow: 0 0 0 0.25rem rgba(74, 222, 128, 0.25) !important;
            }

        .section-title {
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 0;
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar inyectado dinámicamente -->
    <div id="navbar-placeholder"></div>

    <main class="container py-4 flex-grow-1">
        <section class="search-hero mb-5">
            <!-- Carrusel de fondo cada 5 segundos sin pausa al pasar el mouse -->
            <div id="heroCarousel" class="carousel slide carousel-fade hero-carousel-bg" data-bs-ride="carousel" data-bs-interval="5000" data-bs-pause="false">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1400&q=85" alt="Bosques y montañas de Hidalgo">
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1518548419970-58e3b4079ab2?auto=format&fit=crop&w=1400&q=85" alt="Pueblos Mágicos de Hidalgo">
                    </div>
                    <div class="carousel-item">
                        <img src="https://images.unsplash.com/photo-1469474968028-56623f02e42e?auto=format&fit=crop&w=1400&q=85" alt="Naturaleza y aventura en Hidalgo">
                    </div>
                </div>
            </div>

            <!-- Viñeta ligera -->
            <div class="hero-overlay"></div>

            <!-- Indicadores estilo píldora -->
            <div class="hero-indicators">
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="0" class="active" aria-label="Slide 1"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="1" aria-label="Slide 2"></button>
                <button type="button" data-bs-target="#heroCarousel" data-bs-slide-to="2" aria-label="Slide 3"></button>
            </div>

            <!-- Contenido principal encima del carrusel -->
            <div class="hero-content">
                <span class="text-turistar-green fw-bold text-uppercase d-block mb-2 hero-title-shadow" style="letter-spacing: 2.5px; font-size: 0.8rem;">Explora Hidalgo</span>
                <h1 class="fw-bold h2 mb-4 hero-title-shadow">¿Cuál será tu próxima aventura en Hidalgo?</h1>
                <div class="row justify-content-center">
                    <div class="col-12 col-md-8 col-lg-6">
                        <div class="input-group input-group-lg shadow-lg rounded-pill">
                            <span class="input-group-text search-input-dark border-end-0 ps-4 rounded-start-pill">
                                <i class="bi bi-search text-turistar-green"></i>
                            </span>
                            <input type="text" id="inputBuscarDestino" class="form-control search-input-dark border-start-0 py-3 rounded-end-pill" placeholder="Buscar tu próximo destino en Hidalgo...">
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3">
            <div>
                <span class="text-turistar-green fw-bold text-uppercase" style="letter-spacing: 2px; font-size: 0.78rem;">Destacados</span>
                <h2 class="h4 section-title mt-1">Lugares Tendencia</h2>
            </div>

            <a href="nuevo_destino.html" class="btn btn-glass-ios text-nowrap">
                <i class="bi bi-geo-alt-fill me-2"></i>¿Falta un lugar? ¡Agrégalo!
            </a>
        </div>

        <!-- Alertas y Spinner -->
        <div id="mensajeEstado" class="alert d-none text-center" role="alert"></div>
        <div id="spinnerCarga" class="text-center my-5">
            <div class="spinner-border text-success" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <p class="mt-2 text-muted">Cargando destinos desde la base de datos...</p>
        </div>

        <!-- AQUÍ SE INYECTARÁN LAS TARJETAS DESDE JS -->
        <div id="contenedorDestinos" class="row row-cols-1 row-cols-md-3 g-4 mb-5">
            <!-- El contenido dinámico aparecerá aquí -->
        </div>
        <nav id="paginacionDestinos" class="turistar-pagination mb-5" aria-label="Paginación de destinos"></nav>
    </main>
    <script>
                document.addEventListener("DOMContentLoaded", () => {
                    const heroCarouselEl = document.getElementById("heroCarousel");
                    const indicators = document.querySelectorAll(".hero-indicators button");

                    if (!heroCarouselEl || indicators.length === 0) return;

                    const actualizarIndicador = (index) => {
                        indicators.forEach((btn, i) => {
                            btn.classList.toggle("active", i === index);
                        });
                    };

                    // Sincroniza al iniciar el cambio y al terminar la transición
                    heroCarouselEl.addEventListener("slide.bs.carousel", (event) => {
                        actualizarIndicador(event.to);
                    });

                    heroCarouselEl.addEventListener("slid.bs.carousel", (event) => {
                        actualizarIndicador(event.to);
                    });

                    // Permite hacer clic directo en las barritas para saltar a esa foto
                    indicators.forEach((btn, i) => {
                        btn.addEventListener("click", (e) => {
                            e.preventDefault();
                            const instancia = bootstrap.Carousel.getOrCreateInstance(heroCarouselEl);
                            instancia.to(i);
                            actualizarIndicador(i);
                        });
                    });
                });
    </script>
    <script src="js/config.js?v=1.0"></script>
    <script src="js/components.js?v=6.0"></script>
    <script src="js/explorar.js?v=4.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
