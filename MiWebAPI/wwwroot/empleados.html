<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>CRUD de empleados | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .emp-glass-card {
            background: linear-gradient(155deg, rgba(22, 35, 58, 0.96) 0%, rgba(12, 20, 34, 0.98) 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.35) !important;
            border-radius: 22px !important;
            color: #e2e8f0 !important;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06) !important;
        }

            .emp-glass-card .form-control {
                background-color: #162235 !important;
                border: 1px solid #2b3f5e !important;
                color: #ffffff !important;
                border-radius: 12px !important;
                color-scheme: dark;
            }

                .emp-glass-card .form-control:focus {
                    border-color: #4ade80 !important;
                    box-shadow: 0 0 0 0.22rem rgba(74, 222, 128, 0.22) !important;
                }

                .emp-glass-card .form-control::placeholder {
                    color: #64748b !important;
                }

            .emp-glass-card .input-group-text {
                background-color: rgba(11, 19, 32, 0.9);
                border: 1px solid #2b3f5e;
                color: #4ade80;
                border-radius: 12px 0 0 12px !important;
            }

            .emp-glass-card .input-group .form-control {
                border-radius: 0 12px 12px 0 !important;
            }

        .table-glass {
            --bs-table-bg: transparent;
            --bs-table-color: #e2e8f0;
            --bs-table-border-color: rgba(148, 163, 184, 0.16);
            --bs-table-hover-bg: rgba(74, 222, 128, 0.1);
            --bs-table-hover-color: #ffffff;
            margin-bottom: 0;
        }

            .table-glass thead th {
                background: rgba(11, 19, 32, 0.85);
                color: #4ade80;
                font-weight: 700;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 0.7px;
                border-bottom: 1px solid rgba(74, 222, 128, 0.35);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-turistar py-3">
        <div class="container">
            <a class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0" href="index.html">
                <i class="bi bi-people-fill text-turistar-green"></i> CRUD de empleados
            </a>
            <div class="d-flex gap-2">
                <a class="btn btn-crystal-ios-neutral btn-sm rounded-pill px-3" href="index.html">Inicio</a>
                <button class="btn btn-glass-ios-red btn-sm" onclick="cerrarSesion()">
                    <i class="bi bi-box-arrow-right"></i> Cerrar sesión
                </button>
            </div>
        </div>
    </nav>

    <main class="container py-5 flex-grow-1">
        <div id="mensaje" class="alert d-none rounded-3" role="alert"></div>

        <div class="row g-4">
            <section class="col-lg-4">
                <div class="card emp-glass-card border-0 sticky-lg-top form-card" style="top: 100px;">
                    <div class="card-body p-4">
                        <span class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 1.8px; font-size: 0.72rem;">Registro</span>
                        <h2 id="tituloFormulario" class="h4 fw-bold text-white mb-3">Nuevo empleado</h2>

                        <form id="formEmpleado">
                            <input type="hidden" id="idEmpleado" value="0">

                            <div class="mb-3">
                                <label for="nombreCompleto" class="form-label small fw-semibold text-light">Nombre completo</label>
                                <input type="text" class="form-control" id="nombreCompleto" required maxlength="100">
                            </div>

                            <div class="mb-3">
                                <label for="correo" class="form-label small fw-semibold text-light">Correo</label>
                                <input type="email" class="form-control" id="correo" required maxlength="100">
                            </div>

                            <div class="mb-3">
                                <label for="sueldo" class="form-label small fw-semibold text-light">Sueldo</label>
                                <input type="number" class="form-control" id="sueldo" required min="0" step="0.01">
                            </div>

                            <div class="mb-4">
                                <label for="fechaContrato" class="form-label small fw-semibold text-light">Fecha de contratación</label>
                                <input type="date" class="form-control" id="fechaContrato" required>
                            </div>

                            <div class="d-grid gap-2 d-sm-flex">
                                <button type="submit" id="btnGuardar" class="btn btn-glass-ios flex-grow-1">
                                    Guardar
                                </button>
                                <button type="button" id="btnCancelar" class="btn btn-crystal-ios-neutral rounded-pill px-3 d-none">
                                    Cancelar
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <section class="col-lg-8">
                <div class="card emp-glass-card border-0">
                    <div class="card-body p-4">
                        <div class="d-flex flex-column flex-md-row justify-content-between gap-3 mb-3">
                            <div>
                                <span class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 1.8px; font-size: 0.72rem;">Directorio</span>
                                <h1 class="h3 fw-bold text-white mb-1">Lista de empleados</h1>
                                <p class="text-muted small mb-0">Datos obtenidos desde la API de .NET.</p>
                            </div>
                            <button id="btnRecargar" class="btn btn-glass-ios btn-sm align-self-md-start">
                                <i class="bi bi-arrow-clockwise me-1"></i> Recargar
                            </button>
                        </div>

                        <div class="input-group mb-3">
                            <span class="input-group-text"><i class="bi bi-search"></i></span>
                            <input id="txtFiltro" type="search" class="form-control" placeholder="Nombre o correo">
                        </div>

                        <div class="table-responsive rounded-3 overflow-hidden border border-secondary border-opacity-25">
                            <table class="table table-glass table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Nombre completo</th>
                                        <th>Correo</th>
                                        <th class="text-end">Sueldo</th>
                                        <th>Fecha</th>
                                        <th class="text-center">Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaEmpleados"></tbody>
                            </table>
                        </div>

                        <div id="sinResultados" class="text-center text-muted py-4 d-none">
                            No se encontraron empleados.
                        </div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>protegerPagina();</script>
    <script src="js/config.js"></script>
    <script src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
