<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa de Destinos | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .map-container {
            height: 75vh;
            border-radius: 16px;
            overflow: hidden;
            background-color: #e5e3df;
        }

        .location-list {
            height: 75vh;
            overflow-y: auto;
            padding-right: 10px;
        }
            /* Custom scrollbar para la lista de lugares */
            .location-list::-webkit-scrollbar {
                width: 6px;
            }

            .location-list::-webkit-scrollbar-track {
                background: #f1f1f1;
                border-radius: 10px;
            }

            .location-list::-webkit-scrollbar-thumb {
                background: #528233;
                border-radius: 10px;
            }

        .location-item {
            transition: background-color 0.2s, transform 0.2s;
            cursor: pointer;
        }

            .location-item:hover {
                background-color: #fcf8ee !important;
                transform: translateX(4px);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container-fluid px-4 px-lg-5 py-4 flex-grow-1">
        <h1 class="h3 fw-bold mb-4">Descubre el mapa de Hidalgo</h1>

        <div class="row g-4">
            <!-- Barra Lateral con Lugares (Dinámica) -->
            <div class="col-lg-3 col-md-4">
                <div class="location-list" id="listaLugaresMapa">
                    <!-- Spinner de carga -->
                    <div class="text-center my-4" id="spinnerMapa">
                        <div class="spinner-border text-success spinner-border-sm" role="status"></div>
                        <p class="small text-muted mt-2">Cargando lugares...</p>
                    </div>
                </div>
            </div>

            <!-- Contenedor del Mapa -->
            <div class="col-lg-9 col-md-8">
                <div class="map-container shadow-sm border position-relative">
                    <!-- Le agregamos el ID 'iframeMapa' -->
                    <iframe id="iframeMapa" src="https://www.google.com/maps?q=20.1221768,-98.7360212&hl=es&z=9&output=embed" width="100%" height="100%" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/mapa.js"></script> <!-- Script exclusivo del mapa -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
