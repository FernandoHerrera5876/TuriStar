<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mapa de Destinos | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .map-container {
            height: 75vh;
            border-radius: 20px;
            overflow: hidden;
            background-color: #0b1320;
            border: 1px solid rgba(74, 222, 128, 0.35) !important;
            box-shadow: 0 14px 36px rgba(0, 0, 0, 0.55);
            transform: translateZ(0);
        }

        /* Mapa en modo oscuro */
        #iframeMapa {
            width: 100%;
            height: 100%;
            border: 0;
            filter: invert(92%) hue-rotate(180deg) brightness(90%) contrast(96%) saturate(1.1);
            transform: translateZ(0);
        }

        .location-list {
            height: 75vh;
            overflow-y: auto;
            padding: 10px 14px 16px 10px;
        }

            /* Custom scrollbar */
            .location-list::-webkit-scrollbar {
                width: 7px;
            }

            .location-list::-webkit-scrollbar-track {
                background: rgba(19, 29, 46, 0.7);
                border-radius: 10px;
            }

            .location-list::-webkit-scrollbar-thumb {
                background-color: #2e5a44;
                border-radius: 10px;
            }

                .location-list::-webkit-scrollbar-thumb:hover,
                .location-list::-webkit-scrollbar-thumb:active,
                .location-list.is-scrolling::-webkit-scrollbar-thumb {
                    background-color: #4ade80 !important;
                }

        /* Cuadritos de lugares con brillo neón */
        .location-item {
            background-color: #131d2e !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            overflow: hidden;
            transition: all 0.25s ease !important;
            cursor: pointer;
            transform: translateZ(0);
        }

            .location-item:hover {
                background-color: #1b2a44 !important;
                border-color: #4ade80 !important;
                transform: translateY(-2px) translateZ(0) !important;
                box-shadow: 0 0 24px rgba(74, 222, 128, 0.45), inset 0 0 12px rgba(74, 222, 128, 0.12) !important;
            }

            .location-item.active-location {
                background: linear-gradient(135deg, rgba(74, 222, 128, 0.18), rgba(19, 29, 46, 0.96)) !important;
                border: 1.5px solid #4ade80 !important;
                box-shadow: 0 0 22px rgba(74, 222, 128, 0.32) !important;
            }

        /* Recorrido horizontal para nombres largos */
        .location-scroll-text {
            overflow-x: auto;
            overflow-y: hidden;
            white-space: nowrap;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

            .location-scroll-text::-webkit-scrollbar {
                display: none;
            }

        .location-scroll-title {
            display: inline-block;
            transition: transform 1.8s ease-in-out;
        }

        /* En PC se recorre al pasar el cursor; en celular también al quedar seleccionado */
        .location-item:hover .location-scroll-title,
        .location-item.active-location .location-scroll-title {
            transform: translateX(var(--scroll-x, 0px));
        }

        /* Adaptación específica para celulares y tablets verticales */
        @media (max-width: 767.98px) {
            .map-container {
                height: 44vh;
                min-height: 290px;
                border-radius: 16px;
            }

            .location-list {
                height: auto;
                max-height: none;
                overflow-y: visible;
                padding: 4px 2px 16px 2px;
            }
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar inyectado dinámicamente -->
    <div id="navbar-placeholder"></div>

    <main class="container-fluid px-4 px-lg-5 pt-3 pb-4 flex-grow-1">
        <div class="mb-4">
            <span class="text-turistar-green fw-bold text-uppercase d-block mb-1" style="letter-spacing: 2px; font-size: 0.78rem;">Geolocalización</span>
            <h1 class="h3 fw-bold text-white mb-0">Descubre el mapa de Hidalgo</h1>
        </div>

        <div class="row g-4">
            <!-- Barra Lateral con Lugares (En móvil queda debajo del mapa) -->
            <div class="col-lg-3 col-md-4 order-2 order-md-1">
                <div class="location-list" id="listaLugaresMapa">
                    <!-- Spinner de carga -->
                    <div class="text-center my-4" id="spinnerMapa">
                        <div class="spinner-border text-success spinner-border-sm" role="status"></div>
                        <p class="small text-secondary mt-2">Cargando lugares...</p>
                    </div>
                </div>
            </div>

            <!-- Contenedor del Mapa (En móvil aparece primero arriba) -->
            <div class="col-lg-9 col-md-8 order-1 order-md-2">
                <div class="map-container position-relative" id="contenedorMapaPrincipal">
                    <!-- Le agregamos el ID 'iframeMapa' -->
                    <iframe id="iframeMapa" src="https://www.google.com/maps?q=20.1221768,-98.7360212&hl=es&z=9&output=embed" width="100%" height="100%" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js?v=1.0"></script>
    <script src="js/components.js?v=1.0"></script>
    <script src="js/mapa.js?v=7.0"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
