<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Éxito | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css?v=6.0">
    <style>
        .success-glass-card {
            background: linear-gradient(155deg, rgba(22, 35, 58, 0.96) 0%, rgba(12, 20, 34, 0.98) 100%) !important;
            border: 1.5px solid rgba(74, 222, 128, 0.5) !important;
            border-radius: 26px !important;
            box-shadow: 0 0 40px rgba(74, 222, 128, 0.2), 0 18px 46px rgba(0, 0, 0, 0.65) !important;
            max-width: 500px;
            width: 100%;
        }

        .success-icon-ring {
            width: 86px;
            height: 86px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(74, 222, 128, 0.25) 0%, rgba(74, 222, 128, 0.05) 75%);
            border: 2px solid #4ade80;
            color: #4ade80;
            box-shadow: 0 0 28px rgba(74, 222, 128, 0.4);
        }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <div class="card success-glass-card border-0 p-5 text-center">
            <div class="success-icon-ring d-flex align-items-center justify-content-center mx-auto mb-4">
                <i class="bi bi-check-lg display-4"></i>
            </div>
            <span class="text-turistar-green fw-bold text-uppercase small mb-2" style="letter-spacing: 2px;">Comunidad TuriStar</span>
            <h1 class="h3 fw-bold text-white mb-3">¡Tu reseña ha sido publicada con éxito!</h1>
            <p class="text-muted small mb-4">Gracias por compartir tu experiencia con otros viajeros de Hidalgo.</p>
            <div>
                <a href="resenas.html" class="btn btn-glass-ios px-5 py-2 text-decoration-none">Regresar a Reseñas</a>
            </div>
        </div>
    </main>

    <script src="js/components.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
