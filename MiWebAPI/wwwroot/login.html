<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TuriStar | Iniciar Sesión / Registrarse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            height: calc(100vh - 64px);
        }

        .hero-image {
            /* Se corrigió la URL de la imagen para asegurar que cargue */
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 50%), url('https://images.unsplash.com/photo-1544551763-46a013bb70d5?q=80&w=1000&auto=format&fit=crop') center/cover no-repeat;
            height: 100%;
            border-radius: 0 20px 20px 0;
        }

        .tab-active {
            border-bottom: 2px solid #528233;
            color: #528233;
            font-weight: 500;
            padding-bottom: 8px;
            cursor: pointer;
        }

        .tab-inactive {
            color: #6c757d;
            border-bottom: 1px solid #dee2e6;
            padding-bottom: 8px;
            cursor: pointer;
        }

        .form-section {
            display: none;
        }

            .form-section.active {
                display: block;
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100">
    <!-- Navbar inyectado por JS -->
    <div id="navbar-placeholder"></div>

    <div class="row g-0 flex-grow-1 login-container">
        <!-- Imagen Lateral -->
        <div class="col-lg-6 d-none d-lg-block">
            <div class="hero-image position-relative d-flex align-items-end p-5 text-white">
                <div>
                    <h2 class="fw-bold display-6 mb-2">Grutas de Tolantongo</h2>
                    <p class="mb-0 fs-5 text-light">Sumérgete en el paraíso termal escondido en el Cardonal, Hidalgo.</p>
                </div>
            </div>
        </div>

        <!-- Formularios -->
        <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 overflow-auto">
            <div class="card shadow-sm border-0 rounded-4" style="max-width: 420px; width: 100%;">
                <div class="card-body p-4 p-md-5">

                    <div class="d-flex align-items-center justify-content-center gap-2 mb-4">
                        <i class="bi bi-geo-alt fs-3 text-warning"></i>
                        <h1 class="h4 fw-bold mb-0 text-dark">Bienvenido a TuriStar</h1>
                    </div>

                    <!-- Pestañas -->
                    <div class="d-flex mb-4 text-center">
                        <div id="tabLogin" class="w-50 tab-active" onclick="switchTab('login')">Iniciar Sesión</div>
                        <div id="tabRegistro" class="w-50 tab-inactive" onclick="switchTab('registro')">Registrarse</div>
                    </div>

                    <!-- Contenedor de Alertas -->
                    <div id="mensajeAlerta" class="alert d-none py-2 px-3 small" role="alert"></div>

                    <!-- Formulario de Iniciar Sesión -->
                    <form id="formLogin" class="form-section active">
                        <div class="mb-3">
                            <label class="form-label fw-medium small mb-1">Correo Electrónico</label>
                            <input id="loginCorreo" type="email" class="form-control input-yellow p-2" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium small mb-1">Contraseña</label>
                            <input id="loginPassword" type="password" class="form-control input-yellow p-2" required>
                        </div>
                        <button id="btnLogin" type="submit" class="btn bg-turistar-green text-white w-100 py-2 mb-3 fw-medium rounded-3">Iniciar Sesión</button>
                        <!-- type="button" evita que el botón envíe el formulario o recargue la página -->
                        <button type="button" class="btn btn-outline-success w-100 py-2 fw-medium rounded-3" onclick="switchTab('registro')">Crear una Cuenta Nueva</button>
                    </form>

                    <!-- Formulario de Registro -->
                    <form id="formRegistro" class="form-section">
                        <div class="mb-3">
                            <label class="form-label fw-medium small mb-1">Nombre(s)</label>
                            <input id="regNombres" type="text" class="form-control input-yellow p-2" placeholder="Ana" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium small mb-1">Apellidos</label>
                            <input id="regApellidos" type="text" class="form-control input-yellow p-2" placeholder="Perez Hernandez" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium small mb-1">Fecha de nacimiento</label>
                            <input id="regFechaNac" type="date" class="form-control input-yellow p-2" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label fw-medium small mb-1">Correo Electrónico</label>
                            <input id="regCorreo" type="email" class="form-control input-yellow p-2" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-medium small mb-1">Contraseña</label>
                            <input id="regPassword" type="password" class="form-control input-yellow p-2" placeholder="••••••••••••" required>
                        </div>
                        <button id="btnRegistro" type="submit" class="btn bg-turistar-green text-white w-100 py-2 mb-3 fw-medium rounded-3">Crear cuenta</button>
                        <button type="button" class="btn btn-outline-secondary w-100 py-2 fw-medium rounded-3" onclick="switchTab('login')">Volver a Iniciar Sesión</button>
                    </form>

                </div>
            </div>
        </div>
    </div>

    <!-- Se agregó un timestamp al final de los scripts para forzar al navegador a ignorar la caché -->
    <script src="js/components.js?v=1.1"></script>
    <script src="js/login.js?v=1.1"></script>
</body>
</html>
