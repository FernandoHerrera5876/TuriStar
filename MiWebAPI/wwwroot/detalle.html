<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalles del Destino | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos específicos para la portada del destino */
        .hero-destino {
            height: 400px;
            background-size: cover;
            background-position: center;
            position: relative;
            border-radius: 0 0 2rem 2rem;
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.8));
            border-radius: 0 0 2rem 2rem;
        }

        .info-card {
            background-color: #fcf8ee; /* Amarillo clarito de tu paleta */
            border-left: 4px solid #528233; /* Verde TuriStar */
            transition: transform 0.2s;
        }

            .info-card:hover {
                transform: translateY(-3px);
            }
    </style>
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <!-- Spinner General mientras cargan los datos del destino -->
    <div id="spinnerGeneral" class="d-flex justify-content-center align-items-center flex-grow-1 my-5 py-5">
        <div class="spinner-border text-success" role="status" style="width: 3rem; height: 3rem;"></div>
    </div>

    <!-- Contenedor Principal (Se oculta hasta que JavaScript traiga los datos) -->
    <main id="contenidoDestino" class="flex-grow-1 d-none">

        <!-- Encabezado con Imagen de Portada -->
        <div class="container-fluid px-0 mb-5 shadow-sm">
            <div id="detalleImagenBg" class="hero-destino">
                <div class="hero-overlay d-flex align-items-end pb-4">
                    <div class="container">
                        <h1 id="detalleNombre" class="text-white fw-bold display-4 mb-2">Nombre del Destino</h1>
                        <p class="text-white-50 fs-5 mb-0">
                            <i class="bi bi-geo-alt-fill text-success"></i> <span id="detalleMunicipio">Municipio</span>, Hidalgo
                        </p>
                    </div>
                </div>
            </div>
        </div>

        <div class="container mb-5">
            <div class="row g-5">
                <!-- Columna Izquierda: Información y Reseñas -->
                <div class="col-lg-8">

                    <!-- Descripción -->
                    <h3 class="h4 fw-bold mb-3 text-dark">Acerca de este lugar</h3>
                    <p id="detalleDescripcion" class="text-secondary mb-4 fs-5" style="line-height: 1.8;">
                        Cargando descripción...
                    </p>

                    <!-- Tarjetas de Información Extra -->
                    <div class="row g-3 mb-5">
                        <div class="col-md-6">
                            <div class="card info-card border-0 shadow-sm h-100 p-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-white rounded-circle p-3 shadow-sm text-success">
                                        <i class="bi bi-clock-history fs-4"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0">Horarios</h6>
                                        <small id="detalleHorarios" class="text-muted">Cargando...</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card info-card border-0 shadow-sm h-100 p-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-white rounded-circle p-3 shadow-sm text-success">
                                        <i class="bi bi-cash-coin fs-4"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0">Costos</h6>
                                        <small class="text-muted">Entrada: $<span id="detallePrecioEntrada">0</span> | Estacionamiento: $<span id="detallePrecioEst">0</span></small>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-12">
                            <div class="card info-card border-0 shadow-sm h-100 p-3">
                                <div class="d-flex align-items-center gap-3">
                                    <div class="bg-white rounded-circle p-3 shadow-sm text-success">
                                        <i class="bi bi-signpost-split fs-4"></i>
                                    </div>
                                    <div>
                                        <h6 class="fw-bold mb-0">¿Cómo llegar?</h6>
                                        <small id="detalleComoLlegar" class="text-muted">Cargando instrucciones...</small>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SECCIÓN DE RESEÑAS -->
                    <section class="mt-5 pt-3 border-top">
                        <h3 class="h4 fw-bold mb-4">Reseñas de la comunidad</h3>

                        <!-- Contenedor dinámico de reseñas -->
                        <div id="contenedorResenasDestino" class="mb-5">
                            <div class="text-center my-4" id="spinnerResenas">
                                <div class="spinner-border text-success" role="status"></div>
                                <p class="text-muted mt-2 small">Cargando reseñas...</p>
                            </div>
                        </div>

                        <!-- Formulario para publicar nueva reseña -->
                        <div class="card shadow-sm border-0 rounded-4 bg-light">
                            <div class="card-body p-4 p-md-5">
                                <h4 class="h5 fw-bold mb-3">Deja tu opinión</h4>
                                <form id="formNuevaResena">
                                    <div class="mb-3">
                                        <label class="form-label fw-medium small mb-1">Calificación</label>
                                        <select class="form-select border-0 shadow-sm p-3" id="inputCalificacion" required>
                                            <option value="" selected disabled>Selecciona una calificación...</option>
                                            <option value="5">⭐⭐⭐⭐⭐ Excelente (5)</option>
                                            <option value="4">⭐⭐⭐⭐ Muy bueno (4)</option>
                                            <option value="3">⭐⭐⭐ Bueno (3)</option>
                                            <option value="2">⭐⭐ Regular (2)</option>
                                            <option value="1">⭐ Malo (1)</option>
                                        </select>
                                    </div>
                                    <div class="mb-3">
                                        <label class="form-label fw-medium small mb-1">Tu reseña</label>
                                        <textarea class="form-control border-0 shadow-sm p-3" id="inputComentario" rows="4" placeholder="¿Qué te pareció este lugar? Comparte tu experiencia..." required></textarea>
                                    </div>
                                    <div id="alertaResena" class="alert d-none small py-2 text-center" role="alert"></div>
                                    <button type="submit" id="btnEnviarResena" class="btn bg-turistar-green text-white px-4 py-3 rounded-pill fw-bold w-100">
                                        Publicar Reseña
                                    </button>
                                </form>
                            </div>
                        </div>
                    </section>
                </div>

                <!-- Columna Derecha: Panel de acciones sticky -->
                <div class="col-lg-4">
                    <div class="card border-0 shadow-sm rounded-4 sticky-lg-top" style="top: 100px;">
                        <div class="card-body p-4 text-center">
                            <h4 class="fw-bold mb-3">Calificación Promedio</h4>
                            <div class="d-flex justify-content-center align-items-center mb-4 text-warning" style="font-size: 2.5rem;">
                                <i class="bi bi-star-fill"></i>
                                <span id="detallePromedio" class="text-dark fw-bold ms-2">0.0</span>
                            </div>
                            <button id="btnGuardarFavorito" class="btn btn-outline-success rounded-pill w-100 mb-2 fw-medium py-2" style="border-color: #528233; color: #528233;">
                                <i class="bi bi-bookmark-heart"></i> Guardar en favoritos
                            </button>
                            <a href="mapa.html" class="btn bg-turistar-green text-white rounded-pill w-100 fw-medium py-2">
                                <i class="bi bi-map"></i> Ver en el Mapa
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/detalle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
