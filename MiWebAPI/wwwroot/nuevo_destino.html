<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Agregar Destino | TuriStar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: #fdfaf6;">
    <div id="navbar-placeholder"></div>

    <main class="container py-5 flex-grow-1 d-flex justify-content-center">
        <div class="card shadow-sm border-0 rounded-4 p-4 p-md-5 w-100" style="max-width: 600px;">
            <h1 class="h3 fw-bold mb-2">Agregar un nuevo lugar</h1>
            <p class="text-muted mb-4">¿Conoces un lugar increíble en Hidalgo que no está en la lista? ¡Agrégalo para poder reseñarlo!</p>

            <form id="formNuevoDestino">
                <div class="mb-3">
                    <label class="form-label fw-medium small mb-1">Nombre del lugar</label>
                    <input type="text" id="ndNombre" class="form-control p-2" style="background-color: #f0f2f5; border: 1px solid #ced4da;" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small mb-1">Municipio (Ej. Huasca, Omitlán...)</label>
                    <input type="text" id="ndMunicipio" class="form-control p-2" style="background-color: #f0f2f5; border: 1px solid #ced4da;" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-medium small mb-1">Enlace a una foto (URL de Google/Internet)</label>
                    <input type="url" id="ndUrlFoto" class="form-control p-2" style="background-color: #f0f2f5; border: 1px solid #ced4da;" placeholder="https://ejemplo.com/foto.jpg" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-medium small mb-1">Breve descripción</label>
                    <textarea id="ndDescripcion" class="form-control p-2" style="background-color: #f0f2f5; border: 1px solid #ced4da;" rows="3" required></textarea>
                </div>

                <div id="alertaDestino" class="alert d-none small py-2 text-center"></div>

                <button type="submit" id="btnGuardarDestino" class="btn bg-turistar-green text-white w-100 fw-bold py-2 rounded-pill">
                    Guardar y Crear Reseña
                </button>
            </form>
        </div>
    </main>

    <script src="js/config.js"></script>
    <script src="js/components.js"></script>
    <script src="js/nuevo_destino.js"></script>
</body>
</html>
